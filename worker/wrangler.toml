name = "umamanagement-v2"
main = "src/index.ts"
compatibility_date = "2026-11-03"
[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = ["/api/*"]
[[d1_databases]]
binding = "DB"
database_name = "uma-management-v2"
database_id = "ef8987bd-41c5-4a3f-9b66-c5d29ccd8c28"
migrations_dir = "migrations"
[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "uma-management-private"
[vars]
APP_NAME = "UMA Management"
SESSION_DAYS = "7"
