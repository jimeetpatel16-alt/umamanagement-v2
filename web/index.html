<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111c2e"><title>UMA Management</title><link rel="stylesheet" href="/styles.css"></head><body><div id="login" class="login"><section class="loginbox"><div class="mark">U</div><small>WORKFORCE & DELIVERY OPERATIONS</small><h1>UMA Management</h1><p>One workspace. Every operation in control.</p><form id="loginForm">
  <div id="pinLoginFields">
    <label>
      Mobile number
      <input
        name="mobile"
        type="tel"
        placeholder="04XXXXXXXX"
        autocomplete="tel"
        required
      >
    </label>

    <label>
      Four-digit PIN
      <input
        name="pin"
        type="password"
        inputmode="numeric"
        pattern="[0-9]{4}"
        maxlength="4"
        placeholder="Enter your PIN"
        autocomplete="current-password"
        required
      >
    </label>
  </div>

  <div id="adminRecoveryFields" hidden>
    <label>
      Admin email
      <input
        name="email"
        type="email"
        autocomplete="username"
        disabled
      >
    </label>

    <label>
      Admin password
      <input
        name="password"
        type="password"
        autocomplete="current-password"
        disabled
      >
    </label>
  </div>

  <button id="loginButton" type="submit">
    Sign in <b>→</b>
  </button>

  <button
    id="recoveryToggle"
    type="button"
    class="secondary"
  >
    Admin recovery login
  </button>

  <output id="error"></output>
</form></section></div><div id="app" class="layout hide"><aside><div class="brand"><i>U</i><b>UMA<small>MANAGEMENT</small></b></div><p>WORKSPACE</p><nav id="nav"></nav><footer><span id="who"></span><button id="logout">Sign out ↗</button></footer></aside><main><header><small id="role"></small><h2 id="title">Dashboard</h2></header><section id="content"></section></main></div><script src="/app.js" defer></script></body></html>
