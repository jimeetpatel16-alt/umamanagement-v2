<!doctype html>
<!-- Keep the intended premium light dashboard consistent even when the device/browser prefers dark mode. -->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131c2e">
  <meta name="description" content="UMA Management operations dashboard">
  <title>UMA Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }
    html { min-height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
    body { min-height: 100%; margin: 0; padding: 0; }
    img { max-width: 100%; }
    [hidden]:not([hidden="until-found" i]) { display: none !important; }
  </style>
</head>
<body>
  <div id="shell">
    <nav id="sidebar" aria-label="Main navigation"></nav>
    <div id="main">
      <div id="topbar">
        <button class="btn btn-icon" id="hamburgerBtn" type="button" aria-label="Open menu" aria-controls="mobilenav" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <div id="topbar-title" class="topbar-title"></div>
        <div style="width:44px;"></div>
      </div>
      <main id="content" role="main"></main>
    </div>
  </div>
  <div id="drawer-backdrop" class="hidden"></div>
  <nav id="mobilenav" class="hidden" aria-label="Mobile navigation"></nav>
  <div id="gate"></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite" aria-atomic="true"></div>
  <script>
    // Try several ExcelJS CDNs, but keep the main application usable when export
    // libraries are blocked by a network filter or an offline connection.
    (function () {
      var sources = [
        'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
        'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js'
      ];
      function loadApp() {
        var excel = document.createElement('script');
        excel.src = 'excel.js';
        excel.onload = function () {
          var app = document.createElement('script');
          app.src = 'app.js';
          app.onerror = function () { document.getElementById('gate').textContent = 'Unable to load UMA Management. Refresh the page or check the deployed files.'; };
          document.body.appendChild(app);
        };
        excel.onerror = function () { window.UMA_EXCELJS_LOAD_ERROR = true; var app = document.createElement('script'); app.src = 'app.js'; document.body.appendChild(app); };
        document.body.appendChild(excel);
      }
      function trySource(i) {
        if (i >= sources.length) { window.UMA_EXCELJS_LOAD_ERROR = true; loadApp(); return; }
        var script = document.createElement('script');
        script.src = sources[i];
        script.onload = function () { if (window.ExcelJS) loadApp(); else trySource(i + 1); };
        script.onerror = function () { trySource(i + 1); };
        document.head.appendChild(script);
      }
      trySource(0);
    })();
  </script>
</body>
</html>
